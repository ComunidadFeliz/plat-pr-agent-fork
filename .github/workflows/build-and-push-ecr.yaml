name: Build & push image to ECR

# Construye NUESTRA imagen del review (PR-Agent parcheado) con cache de capas
# y la publica en ECR. Los runs del review luego solo bajan esta imagen.
on:
  push:
    branches: [main]
    paths:                       # todo lo que el Dockerfile mete en la imagen
      - 'pr_agent/**'
      - 'docs/**'                            # ADD docs docs
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'github_action/entrypoint.sh'        # ADD github_action/entrypoint.sh /
      - 'Dockerfile.github_action'
      - '.github/workflows/build-and-push-ecr.yaml'
  workflow_dispatch:             # rebuild manual

permissions:
  id-token: write                # OIDC para asumir el rol de AWS (sin llaves estáticas)
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}            # Variable del repo, ej. us-east-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}    # Variable del repo, ej. plat-pr-agent

concurrency:                    # evita que dos pushes a main peleen por :latest
  # Per-ref: a branch build must not cancel the main build that publishes :latest.
  group: build-push-ecr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}   # Variable del repo (el ARN no es secreto)
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only main moves :latest -- that tag is what EVERY consumer pulls on every
      # review run, so a manual dispatch from a branch must never touch it. Branch
      # builds publish the per-sha tag only, so a single repo can be pointed at it
      # (CODE_REVIEW_IMAGE_TAG) to validate an engine change before rolling it out.
      - name: Resolve image tags
        id: tags
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$ECR_REPOSITORY"
          tags="$image:$GITHUB_SHA"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="$tags"$'\n'"$image:latest"
          fi
          { echo "tags<<EOF"; echo "$tags"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "tags to publish:"; echo "$tags"

      - name: Build & push (con cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.github_action     # el que compila desde fuente (PR #2)
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
